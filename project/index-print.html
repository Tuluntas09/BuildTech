<!DOCTYPE html>
<html lang="en" data-theme="hud">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BuildTech — Print</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="styles-futuristic.css" />
  <style>
    /* ---- Print page layout ---- */
    html, body { height: auto; background: #04050A; }
    #root { height: auto; }
    .print-page {
      width: 1440px;
      height: 900px;
      overflow: hidden;
      position: relative;
      break-after: page;
      page-break-after: always;
      background: #04050A;
      margin: 0 auto;
    }
    .print-page:last-child { break-after: auto; page-break-after: auto; }
    .print-page.tall { height: 1660px; }
    .print-page .app { height: 100%; }
    /* contain the ambient grid within each page (no fixed repeats) */
    [data-theme="hud"] .print-page .app::before { position: absolute !important; }
    /* hide the drawer scrim so the table behind stays bright */
    .print-page .drawer-scrim { display: none !important; }
    /* on-screen separation between pages while previewing */
    .print-page { box-shadow: 0 0 0 1px rgba(99,102,241,0.15); margin-bottom: 24px; }

    @media print {
      @page { size: landscape; margin: 0.4cm; }
      html, body { background: #04050A; }
      .print-page { margin: 0 auto; box-shadow: none; }
      /* force background/foreground colors to print */
      *, *::before, *::after {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      /* jump entrance animations to their end state */
      *, *::before, *::after {
        animation-delay: -99s !important;
        animation-duration: .001s !important;
        animation-iteration-count: 1 !important;
        animation-fill-mode: both !important;
        animation-play-state: running !important;
        transition-duration: 0s !important;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="data.js"></script>
  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="charts.jsx"></script>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="screen_universe.jsx"></script>
  <script type="text/babel" src="screen_watchlist.jsx"></script>
  <script type="text/babel" src="screen_builder.jsx"></script>
  <script type="text/babel" src="screen_results.jsx"></script>
  <script type="text/babel" src="screen_history.jsx"></script>
  <script type="text/babel" src="print.jsx"></script>
</body>
</html>
