repos:
  # Standard hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: mixed-line-ending

  # BuildTech: forecasting-term linter (language discipline lock)
  # Flags forbidden terms in source files and UI strings.
  # Forbidden: expected return, forecast, predicted, projected, anticipated
  # Allowed only in documentation that explicitly lists them as forbidden.
  - repo: local
    hooks:
      - id: no-forecasting-terms
        name: Forecasting-term linter
        language: python
        entry: python scripts/lint_forecasting_terms.py
        types_or: [python, javascript, ts, tsx, jsx, html, css]
        pass_filenames: true
        fail_fast: false
